    <script src="data.js"></script>
    <script>
      function reorganizeCoordinates(data) {
        // 創建節點映射
        const nodeMap = {};
        const connections = [];
        const rootNodes = [];

        // 第一步：分離節點和連接線
        data.forEach((item) => {
          if (item.type && item.type !== "line") {
            nodeMap[item.id] = {
              ...item,
              children: [],
            };
            // 找出根節點
            if (!item.parent) {
              rootNodes.push(item.id);
            }
          } else if (item.from && item.to) {
            connections.push(item);
          }
        });

        // 第二步：建立父子關係
        Object.values(nodeMap).forEach((node) => {
          if (node.parent && nodeMap[node.parent]) {
            nodeMap[node.parent].children.push(node.id);
          }
        });

        // 第三步：重新分配座標
        const spacing = {
          xGap: 400, // 水平間距
          yGap: 150, // 垂直間距
          levelHeight: 150, // 每層高度
        };

        // 為每個層級分配座標
        rootNodes.forEach((rootId) => {
          assignCoordinates(rootId, 0, 0, nodeMap, spacing);
        });

        // 更新連接線座標
        updateConnections(connections, nodeMap);

        // 轉換回陣列
        const result = [];
        Object.values(nodeMap).forEach((node) => {
          const { children, ...nodeData } = node;
          result.push(nodeData);
        });
        connections.forEach((conn) => result.push(conn));

        return result;
      }

      // 遞歸分配座標
      function assignCoordinates(nodeId, level, index, nodeMap, spacing) {
        const node = nodeMap[nodeId];
        if (!node) return;

        // 計算該節點的座標
        node.x = level * spacing.xGap;
        node.y = index * spacing.yGap;

        // 移除可能干擾布局的屬性
        delete node.dx;
        delete node.dy;

        // 取得子節點
        const childrenArray = node.children || [];

        // 針對二元樹的處理 - 最多有兩個子節點
        if (childrenArray.length > 0) {
          // 計算子樹的寬度
          const treeWidth = Math.pow(2, level) * spacing.xGap;
          const halfWidth = treeWidth / 2;

          // 為每個子節點分配座標
          childrenArray.forEach((childId, i) => {
            // 對於二元樹，左右子節點的水平偏移
            // i=0是左子節點，i=1是右子節點
            const horizontalOffset = i === 0 ? -halfWidth : halfWidth;

            // 建立子節點座標
            const childNode = nodeMap[childId];
            if (childNode) {
              // 遞歸處理子節點
              assignCoordinatesWithBinaryOffset(
                childId,
                level + 1,
                2 * index + i, // 垂直位置也相應調整
                nodeMap,
                spacing,
                node.x + horizontalOffset
              );
            }
          });
        }
      }

      // 針對二元樹的座標分配
      function assignCoordinatesWithBinaryOffset(
        nodeId,
        level,
        index,
        nodeMap,
        spacing,
        xPosition
      ) {
        const node = nodeMap[nodeId];
        if (!node) return;

        // 直接使用傳入的水平位置
        node.x = xPosition;
        node.y = index * spacing.yGap;

        delete node.dx;
        delete node.dy;

        // 獲取子節點
        const childrenArray = node.children || [];

        // 針對二元樹的處理
        if (childrenArray.length > 0) {
          // 隨著層級增加，每層子樹的寬度減半
          const treeWidth =
            Math.pow(2, (level > 0 ? level : 1) - 1) * spacing.xGap;
          const halfWidth = treeWidth / 2;

          childrenArray.forEach((childId, i) => {
            // 計算偏移量：左子節點為負，右子節點為正
            const horizontalOffset = i === 0 ? -halfWidth : halfWidth;

            // 遞歸處理子節點
            assignCoordinatesWithBinaryOffset(
              childId,
              level + 1,
              2 * index + i,
              nodeMap,
              spacing,
              node.x + horizontalOffset
            );
          });
        }
      }

      // 計算子樹大小（節點總數）- 這個可以保留但在二元樹中簡化
      function calculateSubtreeSize(nodeId, nodeMap) {
        const node = nodeMap[nodeId];
        if (!node || !node.children || node.children.length === 0) {
          return 1; // 葉節點大小為1
        }

        // 假設最多有兩個子節點
        return node.children.reduce((sum, childId) => {
          return sum + calculateSubtreeSize(childId, nodeMap);
        }, 0);
      }

      // 更新連接線座標
      function updateConnections(connections, nodeMap) {
        connections.forEach((conn) => {
          const fromNode = nodeMap[conn.from];
          const toNode = nodeMap[conn.to];

          if (fromNode && toNode) {
            // 更新起點和終點
            const fromX = fromNode.x + (fromNode.width || 335) / 2;
            const fromY = fromNode.y + (fromNode.height || 90);
            const toX = toNode.x + (toNode.width || 335) / 2;
            const toY = toNode.y;

            conn.points = [
              { x: fromX, y: fromY },
              { x: fromX, y: fromY + 20 },
              { x: toX, y: fromY + 20 },
              { x: toX, y: toY },
            ];

            // 更新線條屬性
            conn.width = Math.abs(toX - fromX);
            conn.height = Math.abs(toY - fromY) - 70;
            conn.x = Math.min(fromX, toX);
            conn.y = fromY;
          }
        });
      }

      // 執行重新排列
      const reorganizedData = reorganizeCoordinates(originalData);

      // 初始化圖表 - 使用容器ID而不是document.body
      const diagram = new dhx.Diagram("diagram", {
        type: "org",
        defaultShapeType: "img-card",
        scale: 0.35,
      });

      // 加載重新排列後的數據
      diagram.data.parse(reorganizedData);

      // 搜尋相關功能 - 獲取DOM元素
      const searchInput = document.getElementById("searchInput");
      const searchButton = document.getElementById("searchButton");
      const clearInputButton = document.getElementById("clearInputButton");
      const matchCounter = document.getElementById("matchCounter");
      const matchCount = document.getElementById("matchCount");
      const autocompleteResults = document.getElementById(
        "autocompleteResults"
      );

      // 將單一節點參考變更為陣列，以追蹤所有高亮節點
      let highlightedNodes = [];

      // 當點擊其他地方時，隱藏自動完成選項
      document.addEventListener("click", function (e) {
        if (
          !searchInput.contains(e.target) &&
          !autocompleteResults.contains(e.target)
        ) {
          autocompleteResults.classList.add("hidden");
        }
      });

      // 自動完成功能初始化
      function initAutocomplete() {
        // 所有節點的文本列表（用於自動完成）
        const nodeTextList = [];

        // 建立節點文本與ID的映射
        const nodeTextToId = {};

        // 只收集節點，不收集連線
        diagram.data.forEach((item) => {
          if (item.type && item.type !== "line") {
            // 同時考慮 text 和 title
            const text = item.text || "";
            const title = item.title || "";
            const displayText = title ? `${title}: ${text}` : text;

            if (displayText.trim()) {
              nodeTextList.push(displayText);
              nodeTextToId[displayText] = item.id;
            }
          }
        });

        // 返回處理過的數據
        return { nodeTextList, nodeTextToId };
      }

      // 初始化自動完成資料
      const { nodeTextList, nodeTextToId } = initAutocomplete();

      // 更新自動完成選項
      function updateAutocompleteResults(inputValue) {
        // 清空現有選項
        autocompleteResults.innerHTML = "";

        if (!inputValue.trim()) {
          autocompleteResults.classList.add("hidden");
          return;
        }

        // 過濾符合的選項
        const matchingOptions = nodeTextList.filter((text) =>
          text.toLowerCase().includes(inputValue.toLowerCase())
        );

        // 如果有符合項，顯示下拉菜單
        if (matchingOptions.length > 0) {
          matchingOptions.slice(0, 8).forEach((text) => {
            const option = document.createElement("div");
            option.className = "px-4 py-2 cursor-pointer hover:bg-muted";

            // 高亮匹配的部分
            const regex = new RegExp(`(${inputValue})`, "gi");
            option.innerHTML = text.replace(
              regex,
              '<span class="font-bold text-primary">$1</span>'
            );

            // 點擊選項時的動作
            option.addEventListener("click", () => {
              searchInput.value = text;
              autocompleteResults.classList.add("hidden");

              // 高亮顯示對應的節點
              clearHighlight();
              const nodeId = nodeTextToId[text];
              if (nodeId) {
                highlightNode(nodeId);

                // 滾動到節點
                const node = diagram.data.getItem(nodeId);
                if (node) {
                  diagram.scrollTo(node.x, node.y);
                }

                // 更新計數器
                matchCount.textContent = "1";
                matchCounter.classList.remove("hidden");
              }
            });

            autocompleteResults.appendChild(option);
          });

          autocompleteResults.classList.remove("hidden");
        } else {
          autocompleteResults.classList.add("hidden");
        }
      }

      // 控制清除按鈕的顯示與隱藏，同時更新自動完成選項
      searchInput.addEventListener("input", () => {
        clearInputButton.classList.toggle("hidden", !searchInput.value);
        updateAutocompleteResults(searchInput.value);
      });

      // 搜尋框獲得焦點時，顯示自動完成選項
      searchInput.addEventListener("focus", () => {
        if (searchInput.value.trim()) {
          updateAutocompleteResults(searchInput.value);
        }
      });

      // 支持鍵盤導航自動完成選項
      searchInput.addEventListener("keydown", (e) => {
        const options = autocompleteResults.querySelectorAll("div");
        const currentIndex = Array.from(options).findIndex((option) =>
          option.classList.contains("bg-muted")
        );

        if (options.length === 0) return;

        if (e.key === "ArrowDown") {
          e.preventDefault();

          if (currentIndex < 0) {
            // 選擇第一個選項
            options[0].classList.add("bg-muted");
          } else if (currentIndex < options.length - 1) {
            // 選擇下一個選項
            options[currentIndex].classList.remove("bg-muted");
            options[currentIndex + 1].classList.add("bg-muted");
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();

          if (currentIndex > 0) {
            // 選擇上一個選項
            options[currentIndex].classList.remove("bg-muted");
            options[currentIndex - 1].classList.add("bg-muted");
          }
        } else if (e.key === "Enter" && currentIndex >= 0) {
          // 選擇當前高亮的選項
          e.preventDefault();
          options[currentIndex].click();
        }
      });

      // 清除按鈕的功能
      clearInputButton.addEventListener("click", () => {
        searchInput.value = "";
        clearInputButton.classList.add("hidden");
        autocompleteResults.classList.add("hidden");
        clearHighlight();
      });

      // 搜尋功能實現
      function searchNode() {
        const searchText = searchInput.value.toLowerCase().trim();
        if (!searchText) return;

        // 清除先前的高亮
        clearHighlight();

        // 先移除可能的錯誤樣式
        searchInput.classList.remove(
          "border-destructive",
          "ring-destructive",
          "ring-1"
        );

        // 搜尋節點
        let foundCount = 0;
        let firstFoundNode = null;

        diagram.data.forEach((item) => {
          // 只搜尋節點，不搜尋連線
          if (item.type && item.type !== "line") {
            // 檢查節點的 text 或 title 是否包含搜尋文字
            const itemText = (item.text || "").toLowerCase();
            const itemTitle = (item.title || "").toLowerCase();

            if (
              itemText.includes(searchText) ||
              itemTitle.includes(searchText)
            ) {
              // 找到匹配項，高亮顯示
              highlightNode(item.id);
              foundCount++;

              // 記錄第一個找到的節點，用於滾動顯示
              if (!firstFoundNode) {
                firstFoundNode = item;
              }
            }
          }
        });

        if (foundCount === 0) {
          // 顯示錯誤狀態 - 將搜尋框變紅
          searchInput.classList.add(
            "border-destructive",
            "ring-destructive",
            "ring-1"
          );
          matchCounter.classList.add("hidden");

          // 設置震動效果
          searchInput.animate(
            [
              { transform: "translateX(0)" },
              { transform: "translateX(-5px)" },
              { transform: "translateX(5px)" },
              { transform: "translateX(-5px)" },
              { transform: "translateX(5px)" },
              { transform: "translateX(0)" },
            ],
            {
              duration: 400,
              easing: "ease-in-out",
            }
          );

          // 3秒後恢復正常狀態
          setTimeout(() => {
            searchInput.classList.remove(
              "border-destructive",
              "ring-destructive",
              "ring-1"
            );
          }, 3000);
        } else {
          // 滾動到第一個找到的節點
          if (firstFoundNode) {
            diagram.scrollTo(firstFoundNode.x, firstFoundNode.y);
          }

          // 更新並顯示計數器
          matchCount.textContent = foundCount;
          matchCounter.classList.remove("hidden");
        }
      }

      // 高亮顯示節點
      function highlightNode(id) {
        const nodeEl = document.querySelector(`[data-dhx-id="${id}"]`);
        if (nodeEl) {
          nodeEl.classList.add("highlight");
          highlightedNodes.push(nodeEl);
        }
      }

      // 清除高亮
      function clearHighlight() {
        highlightedNodes.forEach((node) => {
          node.classList.remove("highlight");
        });
        highlightedNodes = [];
        matchCounter.classList.add("hidden");

        // 同時取消選中狀態
        if (currentSelectedNode) {
          const selectedEl = document.querySelector(
            `[data-dhx-id="${currentSelectedNode}"]`
          );
          if (selectedEl) {
            selectedEl.classList.remove("selected-node");
          }
          currentSelectedNode = null;
        }
      }

      // 綁定搜尋按鈕點擊事件
      searchButton.addEventListener("click", searchNode);

      // 綁定鍵盤事件，按下 Enter 鍵進行搜尋
      searchInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          searchNode();
        }
      });

      // 節點抽屜相關功能
      const nodeDrawer = document.getElementById("nodeDrawer");
      const closeDrawer = document.getElementById("closeDrawer");
      const drawerTitle = document.getElementById("drawerTitle");
      const nodeId = document.getElementById("nodeId");
      const nodeTitle = document.getElementById("nodeTitle");
      const nodeText = document.getElementById("nodeText");
      const nodeParent = document.getElementById("nodeParent");
      const nodeChildren = document.getElementById("nodeChildren");

      // 關閉抽屜
      closeDrawer.addEventListener("click", () => {
        nodeDrawer.classList.remove("drawer-open");
      });

      // 點擊節點時顯示抽屜
      function setupNodeClickEvents() {
        // 為所有節點添加點擊事件
        diagram.events.on("shapeclick", function (id) {
          // 獲取節點資料
          const node = diagram.data.getItem(id);
          if (node && node.type !== "line") {
            // 選中節點
            selectNode(id);

            // 顯示節點詳細資訊
            showNodeDetails(node);
          }
        });

        // 點擊背景取消選中
        document
          .getElementById("diagram")
          .addEventListener("click", function (e) {
            // 檢查點擊是否在節點外部
            if (
              e.target.classList.contains("dhx_diagram_flow") ||
              e.target.classList.contains("dhx_diagram_org") ||
              e.target.classList.contains("diagram-container")
            ) {
              // 取消選中當前節點
              if (currentSelectedNode) {
                const selectedEl = document.querySelector(
                  `[data-dhx-id="${currentSelectedNode}"]`
                );
                if (selectedEl) {
                  selectedEl.classList.remove("selected-node");
                }
                currentSelectedNode = null;
              }
            }
          });
      }

      // 記錄當前選中的節點
      let currentSelectedNode = null;

      // 選中節點功能
      function selectNode(id) {
        // 如果有之前選中的節點，先移除選中狀態
        if (currentSelectedNode) {
          const prevSelectedEl = document.querySelector(
            `[data-dhx-id="${currentSelectedNode}"]`
          );
          if (prevSelectedEl) {
            prevSelectedEl.classList.remove("selected-node");
          }
        }

        // 如果點擊的是同一個節點，取消選中
        if (currentSelectedNode === id) {
          currentSelectedNode = null;
          return;
        }

        // 保存當前選中的節點ID並添加選中樣式
        currentSelectedNode = id;
        const nodeEl = document.querySelector(`[data-dhx-id="${id}"]`);
        if (nodeEl) {
          nodeEl.classList.add("selected-node");
        }
      }

      // 顯示節點詳細資訊
      function showNodeDetails(node) {
        // 更新抽屜標題
        drawerTitle.textContent = node.title
          ? `${node.title} 詳細資訊`
          : "節點詳細資訊";

        // 填充基本資訊
        nodeId.textContent = node.id || "-";
        nodeTitle.textContent = node.title || "-";
        nodeText.textContent = node.text || "-";

        // 填充父節點資訊
        if (node.parent) {
          const parentNode = diagram.data.getItem(node.parent);
          if (parentNode) {
            const parentInfo = parentNode.title
              ? `${parentNode.title} (${parentNode.id})`
              : `${parentNode.id}`;
            nodeParent.textContent = parentInfo;

            // 為父節點添加點擊事件
            nodeParent.style.cursor = "pointer";
            nodeParent.style.color = "hsl(var(--primary))";
            nodeParent.onclick = function () {
              const parentNode = diagram.data.getItem(node.parent);
              if (parentNode) {
                diagram.scrollTo(parentNode.x, parentNode.y);
              }
            };
          } else {
            nodeParent.textContent = `${node.parent} (未找到)`;
            nodeParent.style.cursor = "default";
            nodeParent.style.color = "";
            nodeParent.onclick = null;
          }
        } else {
          nodeParent.textContent = "無";
          nodeParent.style.cursor = "default";
          nodeParent.style.color = "";
          nodeParent.onclick = null;
        }

        // 填充子節點資訊
        nodeChildren.innerHTML = "";

        // 查找所有以此節點為父節點的節點
        const childNodes = [];
        diagram.data.forEach((item) => {
          if (item.parent === node.id) {
            childNodes.push(item);
          }
        });

        if (childNodes.length > 0) {
          const childList = document.createElement("div");
          childList.className = "space-y-1 mt-1";

          childNodes.forEach((child) => {
            const childItem = document.createElement("div");
            childItem.className = "text-primary cursor-pointer hover:underline";
            childItem.textContent = child.title
              ? `${child.title} (${child.id})`
              : `${child.id}`;

            // 添加點擊事件滾動到子節點
            childItem.addEventListener("click", () => {
              diagram.scrollTo(child.x, child.y);
            });

            childList.appendChild(childItem);
          });

          nodeChildren.appendChild(childList);
        } else {
          nodeChildren.textContent = "無";
        }

        // 顯示抽屜
        nodeDrawer.classList.add("drawer-open");
      }

      // 設置節點點擊事件
      setupNodeClickEvents();
    </script>
  </body>
</html>
